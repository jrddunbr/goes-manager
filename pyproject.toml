[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "goes-manager"
version = "0.1.0"
description = "Tools for monitoring and managing GOES satellite ground-station data"
readme = "readme.md"
requires-python = ">=3.14"
dependencies = [
  "boto3>=1.35",
  "Flask>=3.0",
  "Pillow>=10.0",
  "pika>=1.3",
  "requests>=2.32",
]
license = "MIT"
authors = [
  { name = "Jared" }
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Operating System :: POSIX :: Linux",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
goes_dashboard = ["templates/*.html", "data/*.csv"]
